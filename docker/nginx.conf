server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Preserve mapped host port (e.g. :8080) on directory slash redirects
    absolute_redirect off;

    # Match GitHub Pages custom 404 behavior
    error_page 404 /404.html;

    # Ensure edits show up immediately on refresh during local development
    etag on;
    add_header Cache-Control "no-cache";

    # Block accidental browsing of dot-directories (.git) locally
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
